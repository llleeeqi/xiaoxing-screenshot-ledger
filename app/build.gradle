plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xingledger.quickcapture'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xingledger.quickcapture'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.4.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // ML Kit's generated component graph fails under R8 optimization on
            // real devices; ABI splits and compressed JNI already cut APK size.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    packaging {
        jniLibs {
            // Smaller download/APK; Android extracts the one matching native library at install time.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'

    testImplementation 'junit:junit:4.13.2'
}
